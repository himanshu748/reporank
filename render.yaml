# Render Blueprint Specification (1-Click Deploy)
# https://render.com/docs/blueprints

services:
  - type: web
    name: reporank
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 8000
      - key: HF_TOKEN
        sync: false # Set your Hugging Face API key in the Render dashboard
